# Alembic config for nimi-service. The database URL comes from the service settings
# (NIMI_DB_HOST / NIMI_DB_PORT / NIMI_DB_NAME / NIMI_DB_USER / NIMI_DB_PASSWORD[_FILE]); see db/migrations/env.py.
# Normally run through the CLI:  python -m nimi_service db upgrade | db revision "msg" | db current
[alembic]
script_location = %(here)s/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
